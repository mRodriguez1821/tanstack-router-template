name: Release Version

on:
  push:
    branches:
      - main # Or your default branch

jobs:
  release:
    # Prevent infinite loops if standard-version commits include [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    # Required so the action can push commits and tags back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout repo (fetch full history for changelog generation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # standard-version needs full git history to determine version/changelog

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run standard-version
        run: npm run release # Or 'npx standard-version' directly

      - name: Push changes and tags
        run: git push --follow-tags origin main
